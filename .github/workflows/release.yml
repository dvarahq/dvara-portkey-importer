name: release
# Push a tag like v0.1.0 to publish the runnable jar as a GitHub release asset.
# The JBang alias (github.com/dvarahq/jbang-catalog) points at that asset.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Tests and runnable jar
        run: ./mvnw -B verify
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/dvara-portkey-importer.jar \
            --title "$GITHUB_REF_NAME" --generate-notes
